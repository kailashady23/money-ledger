<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Ledger</title>
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: soft grey canvas, white rounded sheets. Home = balance sheet, dark action strip, transaction sheet; side column for stats on wide screens. Bottom tab bar on phones. */
  --bg:#f2f2f4; --surface:#ffffff; --surface-2:#f4f4f6; --ink:#111114; --muted:#76767f; --faint:#b3b3bb; --line:#ebebef;
  --accent:#767cf0; --accent-ink:#ffffff; --accent-soft:#ececfd;
  --band:#1b1b1e; --band-ink:#f4f4f6; --band-line:#3a3a40;
  --primary:#111114; --primary-ink:#ffffff;
  --good:#16804c; --good-soft:#e2f4ea; --bad:#c8372d; --bad-soft:#fbe7e4; --warn:#9a6200; --warn-soft:#fbf0d8;
  --c1:#7cc3ec; --c2:#f39f63; --c3:#55a466; --c4:#ad84ee; --c5:#6a6a72; --c6:#6670d6; --c7:#d8d27a; --c8:#93d97c; --c9:#d0413b; --c10:#e48bb6;
  --font-display:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090a; --surface:#161618; --surface-2:#212124; --ink:#f3f3f5; --muted:#9a9aa4; --faint:#5b5b63; --line:#27272b;
    --accent:#9ea2ff; --accent-ink:#0b0b10; --accent-soft:#262848;
    --band:#1f1f22; --band-ink:#f3f3f5; --band-line:#38383e;
    --primary:#f3f3f5; --primary-ink:#0a0a0b;
    --good:#4fc98d; --good-soft:#12301f; --bad:#ff7b6b; --bad-soft:#3a1915; --warn:#e8b54c; --warn-soft:#33270e;
    --c5:#8a8a93;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090a; --surface:#161618; --surface-2:#212124; --ink:#f3f3f5; --muted:#9a9aa4; --faint:#5b5b63; --line:#27272b;
  --accent:#9ea2ff; --accent-ink:#0b0b10; --accent-soft:#262848;
  --band:#1f1f22; --band-ink:#f3f3f5; --band-line:#38383e;
  --primary:#f3f3f5; --primary-ink:#0a0a0b;
  --good:#4fc98d; --good-soft:#12301f; --bad:#ff7b6b; --bad-soft:#3a1915; --warn:#e8b54c; --warn-soft:#33270e;
  --c5:#8a8a93;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:25px;white-space:nowrap;text-decoration:none}
.brand svg{width:24px;height:24px}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface)}
.nav svg{width:22px;height:22px;display:none}
.top-icons{display:flex;gap:8px;align-items:center;margin-left:auto}
.ibtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:20px;height:20px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}

.main{max-width:1180px;margin:0 auto;padding:8px 20px 110px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:22px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.home{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}

/* money */
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.money .cur{font-size:.55em;vertical-align:.62em;color:var(--faint);margin-right:.12em;font-weight:600}
.money .dec{color:var(--faint)}
.xl{font-size:clamp(46px,8vw,68px);font-weight:600;letter-spacing:-.035em;line-height:1}
.lg{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.md{font-size:20px;font-weight:600;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)} .muted{color:var(--muted)} .sm{font-size:13px}

/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hero-top .lbl{font-size:16px;color:var(--muted);font-weight:600}
.pill-select{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:7px 30px 7px 14px;cursor:pointer;max-width:200px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:14px;color:var(--muted);font-weight:600}
.hero-sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.tile{background:var(--surface-2);border-radius:var(--r-md);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-height:128px;cursor:pointer;border:0;text-align:left;min-width:0}
.tile:hover{filter:brightness(.98)}
.tile-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.tile-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.tile-ic svg{width:16px;height:16px}
.tile .money{margin-top:auto;font-size:22px;font-weight:600;letter-spacing:-.02em}
.tile .arrow{margin-top:auto;font-size:22px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-2);margin-left:-6px}
.dots i:first-child{margin-left:0}

/* action band */
.band{background:var(--band);border-radius:var(--r-lg);padding:12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.band button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--band-ink);border:1.5px solid var(--band-line);border-radius:999px;padding:9px 16px 9px 10px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.band button:hover{background:color-mix(in srgb,var(--band-ink) 8%,transparent)}
.band .ring{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--band-line);display:grid;place-items:center}
.band svg{width:15px;height:15px}
.band .more{flex:0 0 auto;padding:9px 14px}

/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:42px;line-height:1.05;margin:0;letter-spacing:-.005em;text-wrap:balance}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.page-h{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:14px 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.link{border:0;background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.link:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* rows */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0}
.row + .row{border-top:1px solid var(--line)}
.row.click{cursor:pointer;border-radius:var(--r-sm)}
.cat{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;
  background:color-mix(in srgb,var(--c,var(--c5)) 22%,var(--surface));color:color-mix(in srgb,var(--c,var(--c5)) 62%,var(--ink))}
.cat svg{width:20px;height:20px}
.t1{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-size:16px;text-align:right}
.row-act{display:flex;gap:2px;justify-content:flex-end;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);vertical-align:2px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar>i.good{background:var(--good)} .bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:12px 26px}
.kv div{display:grid}
.kv span{font-size:12.5px;color:var(--muted);font-weight:700}
.kv b{font-variant-numeric:tabular-nums;font-size:16px}
.empty{padding:26px 8px;color:var(--muted);text-align:center}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r-md);padding:14px 18px;margin:6px 0 14px}
.banner p{margin:0;max-width:62ch}
.callout{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:9px 0}
.catrow .bar{grid-column:1/-1}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}

/* stats */
.donut-wrap{position:relative;height:300px;max-width:360px;margin:0 auto}
.donut-wrap.small{height:220px;max-width:260px}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.donut-c .money{font-size:40px;font-weight:700;letter-spacing:-.03em}
.donut-wrap.small .donut-c .money{font-size:28px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 22px;margin-top:20px}
.legend div{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;padding:3px 0;min-width:0}
.legend span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button,.seg label{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;position:relative;text-align:center}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.period{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 6px}
.period button{border:0;background:none;color:var(--faint);font-weight:700;cursor:pointer;font-size:15px;padding:6px}
.period button:first-child{text-align:left}.period button:last-child{text-align:right}
.period button:disabled{visibility:hidden}
.period .cur-p{font-size:20px;font-weight:800;text-align:center}
.chart{position:relative;height:220px}

/* forms & dialog */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.toolbar select,.toolbar input{width:auto;background:var(--surface)}
dialog{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(8 8 12 / .5)}
.form{display:grid;gap:14px;padding:24px;max-height:calc(100dvh - 40px);overflow:auto}
.form .ttl{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.field{display:grid;gap:6px}
.field>label,.flbl{font-size:13px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.form-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.typegrid label{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px;cursor:pointer;font-weight:700;font-size:13.5px;position:relative;border:1.5px solid transparent}
.typegrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.typegrid input{position:absolute;opacity:0;width:1px;height:1px}
.typegrid label:has(input:focus-visible){outline:2px solid var(--accent)}
.typegrid .cat{width:28px;height:28px;border-radius:9px;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.tscroll{overflow:auto;max-height:300px}
.ringsvg{transform:rotate(-90deg)}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0}
.goal + .goal{border-top:1px solid var(--line)}
.loading{padding:90px 0;text-align:center;color:var(--muted)}

@media (max-width:980px){ .home{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top-in{height:58px;gap:10px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;flex:1;min-width:0;border-radius:12px}
  .nav a.desk{display:none}
  .nav svg{display:block}
  .nav a[aria-current="page"]{background:none;color:var(--accent)}
  .sync span:last-child{display:none}
  .main{padding:4px 12px 110px}
  .card{padding:18px;border-radius:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three{grid-template-columns:1fr}
  h1{font-size:36px}
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:26px 26px 0 0}
  .form{padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .hide-sm{display:none}
}
@media (min-width:761px){ .only-sm{display:none!important} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="Money Ledger home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--ink)"/><path d="M7 14.5c1.4 1.6 3 2.4 5 2.4s3.6-.8 5-2.4M8.5 9.5h.01M15.5 9.5h.01" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Ledger</a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="top-icons">
    <span class="sync" id="sync"><span class="dot"></span><span>Loading</span></span>
    <a class="ibtn only-sm" href="#accounts" aria-label="Accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg></a>
    <a class="ibtn" href="#preferences" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
  </div>
</div></header>
<main class="main" id="main"><div class="loading">Loading your money…</div></main>
<dialog id="dlg" aria-label="Form"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* money as html: small symbol, grey decimals */
function money(n, {dec = 2, sign = false, cls = ''} = {}){
  const f = nf(dec); if (!f) return `<span class="money ${cls}">${esc((n||0).toFixed(dec))}</span>`;
  const parts = f.formatToParts(Math.abs(n || 0)); let h = '', after = false;
  for (const p of parts){
    if (p.type === 'currency') h += `<span class="cur">${esc(p.value.trim())}</span>`;
    else if (p.type === 'decimal' || p.type === 'fraction') { h += `<span class="dec">${esc(p.value)}</span>`; after = true; }
    else if (p.type === 'literal') { if (p.value.trim()) h += esc(p.value); }
    else h += esc(p.value);
  }
  const s = n < 0 ? '−' : sign && n > 0 ? '+' : '';

}

/* ================= money maths ================= */
function txEffect(t, id){
  const a = num(t.amount);
  switch (t.type){
    case 'income': case 'divest': return t.acct === id ? a : 0;
    case 'expense': case 'invest': return t.acct === id ? -a : 0;
    case 'adjust': return t.acct === id ? a : 0;
    case 'transfer': return (t.to === id ? a : 0) - (t.acct === id ? a : 0);
  }
  return 0;
}
function balance(acct, upTo){ let b = num(acct.opening); for (const t of all('tx')) if (!upTo || t.date <= upTo) b += txEffect(t, acct.id); return b; }
function calcEmi(P, ratePct, n){ P = num(P); n = Math.max(1, Math.round(num(n))); const r = num(ratePct)/1200; if (!P) return 0; if (!r) return P/n; const f = Math.pow(1+r, n); return P*r*f/(f-1); }
function loanStats(l){
  const r = num(l.rate)/1200; let bal = num(l.principal); let interest = 0, paid = 0;
  const pays = [...(l.payments||[])].map((p, i) => ({...p, i})).sort((a, b) => a.date.localeCompare(b.date));
  const rows = pays.map(p => { const amt = num(p.amount); const int = bal*r; const pr = amt - int; interest += Math.min(int, amt); paid += amt; bal = Math.max(0, bal - pr); return {...p, int:Math.min(int, amt), pr:Math.max(0, pr), bal}; });
  const emi = num(l.emi) || calcEmi(l.principal, l.rate, l.term);
  let left; if (bal <= 0.005) left = 0; else if (r > 0) left = emi > bal*r ? Math.ceil(-Math.log(1 - r*bal/emi)/Math.log(1+r)) : Infinity; else left = emi > 0 ? Math.ceil(bal/emi) : Infinity;
  const nextDue = bal > 0.005 && l.start ? addMonths(l.start, pays.length + 1) : null;
  const payoff = isFinite(left) && left > 0 ? addMonths(nextDue || today(), left - 1) : null;
  const futureInt = isFinite(left) && r > 0 ? Math.max(0, emi*left - bal) : 0;
  const pct = num(l.principal) ? Math.min(1, Math.max(0, 1 - bal/num(l.principal))) : 0;
  return {bal, interest, paid, emi, left, nextDue, payoff, futureInt, pct, rows};
}
/* investments: three ways of valuing a holding */
const LEGACY_T = {'Stocks':'stock','ETFs / mutual funds':'fund','Crypto':'crypto','GIC / bonds':'gic','TFSA':'retire','RRSP':'retire','FHSA':'retire','Real estate':'property','Gold':'metal','Other':'other'};
function invType(h){ return h.t && INV_T[h.t] ? h.t : (LEGACY_T[h.itype] || 'other'); }
function invMethod(h){ return h.t ? INV_T[invType(h)].m : 'value'; }
function holding(h){
  const t = invType(h), m = invMethod(h), T = INV_T[t];
  const base = {t, m, T, units:0, avg:0, cost:0, value:0, gain:0, realized:0, price:num(h.price)};
  if (m === 'units'){
    let units = 0, cost = 0, realized = 0;
    const lots = [...(h.lots||[])].map((l, i) => ({...l, i})).sort((a, b) => a.date.localeCompare(b.date));
    for (const l of lots){ const u = num(l.units), p = num(l.price), fee = num(l.fee);
      if (l.side === 'sell'){ const avg = units ? cost/units : 0; const uu = Math.min(u, units); cost -= avg*uu; units -= uu; realized += uu*p - fee - avg*uu; }
      else { units += u; cost += u*p + fee; } }
    const value = units*num(h.price);
    return {...base, units, cost, avg:units ? cost/units : 0, value, gain:value - cost, realized, lots};
  }
  if (m === 'fixed'){
    const P = num(h.principal), r = num(h.rate)/100, comp = num(h.comp);
    const end = h.maturity && h.maturity < today() ? h.maturity : today();
    const yrs = h.start ? Math.max(0, daysBetween(h.start, end)/365.25) : 0;
    const totYrs = h.start && h.maturity ? Math.max(0, daysBetween(h.start, h.maturity)/365.25) : 0;
    const grow = y => comp ? P*Math.pow(1 + r/comp, comp*y) : P*(1 + r*y);
    const value = grow(yrs), atMat = grow(totYrs);
    const daysLeft = h.maturity ? daysBetween(today(), h.maturity) : null;
    return {...base, cost:P, value, gain:value - P, atMat, daysLeft, matured:daysLeft != null && daysLeft <= 0};
  }
  const contribs = h.contribs ? h.contribs : (h.invested != null ? [{date:h.date || today(), amount:num(h.invested)}] : []);
  const cost = sum(contribs, c => num(c.amount)); const value = num(h.value);
  return {...base, cost, value, gain:value - cost, contribs};
}
const INV = () => all('inv').map(h => ({...h, H:holding(h)})).sort((a, b) => b.H.value - a.H.value);
function totals(){
  const accts = ACCTS().map(a => ({...a, bal:balance(a)}));
  const cash = sum(accts.filter(a => a.atype !== 'credit'), a => a.bal);
  const cards = sum(accts.filter(a => a.atype === 'credit'), a => a.bal);
  const invs = INV(); const inv = sum(invs, i => i.H.value), invCost = sum(invs, i => i.H.cost);
  const ls = LOANS().map(l => ({...l, st:loanStats(l)}));
  const lent = sum(ls.filter(l => l.dir === 'lent'), l => l.st.bal);
  const owed = sum(ls.filter(l => l.dir !== 'lent'), l => l.st.bal);
  return {accts, cash, cards, inv, invCost, invs, ls, lent, owed, net: cash + cards + inv + lent - owed};
}
function spendIn(s, e, kind = 'expense', acct = 'all'){
  return all('tx').filter(t => t.type === kind && t.date >= s && t.date <= e && (acct === 'all' || t.acct === acct));
}
function byCat(list){ const o = {}; for (const t of list){ const c = t.category || 'Other'; o[c] = (o[c]||0) + num(t.amount); } return Object.entries(o).sort((a, b) => b[1] - a[1]); }
function catSpend(ym){ return Object.fromEntries(byCat(spendIn(ym + '-01', monthEnd(ym)))); }
const recKey = t => [t.type, (t.desc||'').trim().toLowerCase(), t.category, t.acct].join('|');
function dueRecurring(){
  const m = curMonth(); const latest = new Map();
  for (const t of [...TX()].reverse()) if (t.recurring && (t.type === 'income' || t.type === 'expense')) latest.set(recKey(t), t);
  const have = new Set(all('tx').filter(t => t.date.startsWith(m)).map(recKey));
  return [...latest.values()].filter(t => !have.has(recKey(t)) && t.date < m + '-01').map(t => {
    const day = Math.min(num(t.date.slice(8, 10)) || 1, num(monthEnd(m).slice(8, 10)));
    return {...t, due:`${m}-${pad(day)}`};
  }).sort((a, b) => a.due.localeCompare(b.due));
}
function periodRange(per, off){
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth(); let s, e, label, short;
  const md = d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  if (per === 'week'){ const d = new Date(y, m, t.getDate()); const dow = (d.getDay() + 6) % 7; s = new Date(d); s.setDate(d.getDate() - dow + 7*off); e = new Date(s); e.setDate(s.getDate() + 6); label = `${md(s)} – ${md(e)}`; short = md(s); }
  else if (per === 'quarter'){ const q = Math.floor(m/3) + off; s = new Date(y, q*3, 1); e = new Date(s.getFullYear(), s.getMonth() + 3, 0); label = `Q${Math.floor(s.getMonth()/3) + 1} ${s.getFullYear()}`; short = `Q${Math.floor(s.getMonth()/3) + 1}`; }
  else if (per === 'year'){ s = new Date(y + off, 0, 1); e = new Date(y + off, 11, 31); label = short = String(y + off); }
  else { s = new Date(y, m + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 0); label = s.toLocaleDateString(undefined, s.getFullYear() === y ? {month:'long'} : {month:'long', year:'numeric'}); short = s.toLocaleDateString(undefined, {month:'short'}); }
  return {s:isoOf(s), e:isoOf(e), label, short};
}

const LS_KEY = 'money-ledger.v1';

function dbErr(e){
  const c = e && e.code;
  if (c === 'invalid_argument') toast('Could not save: this view is read-only for you.');
  else if (c === 'quota_exceeded') toast('Storage is full. Delete some old entries, then try again.');
  else if (c === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
  else toast('Could not save right now. Check your connection and try again.');
  return false;
}
async function dbCall(fn){ try { await fn(); return true; } catch (e) { if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await fn(); return true; } catch (e2) { return dbErr(e2); } } return dbErr(e); } }

async function connect(){
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user && typeof user.id === 'function') uid = await user.id();
    }
  } catch { db = null; }
  if (db && uid){
    Store.col = db.collection('data/users/' + uid);
    const timer = setTimeout(() => { Store.note = 'Can’t reach your saved data yet. The page keeps trying; check your connection.'; renderSync(); if (Store.mode === 'loading') renderAll(); }, 10000);
    let settled = false; const settle = () => { if (!settled){ settled = true; clearTimeout(timer); Store.note = ''; } };
    Store.col.onSnapshot(snap => {
      if (snap.empty){
        if (snap.metadata.fromCache) return;
        settle();
        if (Store.mode === 'demo') return;
        if (Store.mode === 'loading'){ enterDemo('db'); return; }
        docs = new Map(); renderAll(); return;
      }
      if (!snap.metadata.fromCache) settle();
      docs = new Map(snap.docs.map(d => [d.id, d.data()]));
      Store.mode = 'db'; renderAll();
    }, () => {
      settle(); Store.note = 'Lost the connection to your saved data. Reload the page to reconnect.';
      if (Store.mode === 'loading') startLocal(); else { renderSync(); renderAll(); }
    });
  } else startLocal();
}
function startLocal(){ const saved = loadLocal(); if (saved && Object.keys(saved).length){ docs = new Map(Object.entries(saved)); Store.mode = 'local'; renderAll(); } else enterDemo('local'); }

function txRow(t, actions = true){
  const ty = t.type; const isT = ty === 'transfer';
  const sign = ty === 'income' || ty === 'divest' ? 1 : ty === 'expense' || ty === 'invest' ? -1 : ty === 'adjust' ? Math.sign(num(t.amount)) : 0;
  const cat = isT ? 'Transfer' : ty === 'adjust' ? 'Adjustment' : (t.category || 'Other');
  const c = ty === 'income' ? 3 : catColor(cat);
  const glyph = isT ? svg('swap', 2) : ty === 'invest' || ty === 'divest' ? svg('invest', 2) : esc(cat.slice(0, 2));
  const where = isT ? `${esc(acctName(t.acct))} → ${esc(acctName(t.to))}` : esc(acctName(t.acct));
  const title = t.desc || cat;
  return `<div class="row"><div class="cat" style="--c:var(--c${c})">${glyph}</div>
    <div style="min-width:0"><div class="t1">${esc(title)}</div><div class="t2">${isT ? '' : esc(cat) + ' · '}${where} · ${t.recurring ? '↻ ' : ''}${dateLabel(t.date)}</div></div>
    <div><div class="amt ${sign > 0 ? 'pos' : ''}">${money(isT ? num(t.amount) : sign*Math.abs(num(t.amount)), {sign:sign > 0})}</div>${actions ? `<div class="row-act"><button class="btn ghost sm" data-act="edit-tx" data-id="${t.id}">Edit</button><button class="btn ghost sm" data-act="del-tx" data-id="${t.id}">Delete</button></div>` : ''}</div></div>`;
}
function ring(p, size = 46, stroke = 5, color = 'var(--accent)'){
  const r = (size - stroke)/2, c = 2*Math.PI*r, off = c*(1 - Math.min(1, Math.max(0, p)));
  return `<svg class="ringsvg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function goalStats(g){ const saved = sum(g.adds || [], a => num(a.amount)); const p = num(g.target) ? saved/num(g.target) : 0; const months = g.date ? Math.max(0, (parseIso(g.date).getFullYear() - new Date().getFullYear())*12 + parseIso(g.date).getMonth() - new Date().getMonth()) : null; const need = months ? Math.max(0, (num(g.target) - saved)/months) : null; return {saved, p, months, need}; }

  html(){
    const f = view.act; const months = new Set([curMonth(), ...all('tx').map(t => t.date.slice(0, 7))]);
    const cats = [...new Set(all('tx').map(t => t.category).filter(Boolean))].sort();
    return `<div class="page-h"><h1>Activity</h1><div class="btns"><button class="btn" data-act="add-tx" data-type="transfer">Transfer</button><button class="btn" data-act="add-tx" data-type="income">Add income</button><button class="btn primary" data-act="add-tx" data-type="expense">Add expense</button></div></div>
      ${dueStrip()}
      <section class="card">
      <div class="toolbar">
        <label class="sr" for="fMonth">Month</label><select id="fMonth">${[...months].sort().reverse().map(m => `<option value="${m}" ${f.month === m ? 'selected' : ''}>${monthLabel(m, true)}</option>`).join('')}<option value="all" ${f.month === 'all' ? 'selected' : ''}>All time</option></select>
        <label class="sr" for="fAcct">Account</label><select id="fAcct"><option value="all">All accounts</option>${ACCTS().map(a => `<option value="${a.id}" ${f.acct === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
        <label class="sr" for="fType">Type</label><select id="fType">${[['all','Everything'],['income','Money in'],['expense','Money out'],['transfer','Transfers'],['invest','Investing'],['adjust','Adjustments']].map(([v, l]) => `<option value="${v}" ${f.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label class="sr" for="fCat">Category</label><select id="fCat"><option value="all">All categories</option>${cats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <label class="sr" for="fQ">Search</label><input id="fQ" type="search" placeholder="Search" value="${esc(f.q)}" style="flex:1;min-width:140px">
      </div>
      <div id="txOut">${txList()}</div></section>`;
  },
  after(){
    const bind = (id, k) => $('#' + id).addEventListener(id === 'fQ' ? 'input' : 'change', e => { view.act[k] = e.target.value; $('#txOut').innerHTML = txList(); });
    bind('fMonth', 'month'); bind('fAcct', 'acct'); bind('fType', 'type'); bind('fCat', 'cat'); bind('fQ', 'q');
  }
};
function txList(){
  const f = view.act; const q = f.q.trim().toLowerCase();
  const list = TX().filter(t => (f.month === 'all' || t.date.startsWith(f.month)) && (f.acct === 'all' || t.acct === f.acct || t.to === f.acct) && (f.type === 'all' || t.type === f.type || (f.type === 'invest' && t.type === 'divest')) && (f.cat === 'all' || t.category === f.cat) && (!q || [t.desc, t.category, acctName(t.acct), String(t.amount)].join(' ').toLowerCase().includes(q)));
  const inc = sum(list.filter(t => t.type === 'income'), t => num(t.amount)), exp = sum(list.filter(t => t.type === 'expense'), t => num(t.amount));
  return `<div class="kv" style="padding:10px 0 6px"><div><span>Entries</span><b>${list.length}</b></div><div><span>Money in</span><b class="pos">${fmt(inc)}</b></div><div><span>Money out</span><b>${fmt(exp)}</b></div><div><span>Net</span><b class="${inc - exp < 0 ? 'neg' : ''}">${fmtS(inc - exp)}</b></div></div>
    <div class="list">${list.length ? list.map(t => txRow(t)).join('') : '<div class="empty">Nothing matches these filters.</div>'}</div>`;
}
function dueStrip(){
  const due = dueRecurring(); if (!due.length) return '';
  return `<div class="banner" style="display:block"><div class="sec-h" style="margin-bottom:8px"><h2>Monthly entries not logged yet</h2><button class="btn sm primary" data-act="log-all">Log all ${due.length}</button></div>
    <div class="btns">${due.map(t => `<button class="btn sm" style="background:var(--surface)" data-act="log-due" data-id="${t.id}">${esc(t.desc || t.category)} · ${t.type === 'income' ? '+' : '−'}${fmt(num(t.amount), 0)} · ${dateLabel(t.due)}</button>`).join('')}</div></div>`;
}

/* ================= ACCOUNTS ================= */
const pgAccounts = {
  html(){
    const T = totals(); const groups = [['Bank & cash', T.accts.filter(a => a.atype !== 'credit')], ['Credit cards', T.accts.filter(a => a.atype === 'credit')]];

      <div class="grid2">${groups.map(([g, list]) => `<section class="card"><div class="sec-h"><h2>${g}</h2><span class="sm muted" style="font-weight:700">${fmt(sum(list, a => a.atype === 'credit' ? -a.bal : a.bal))}${g === 'Credit cards' ? ' owed' : ''}</span></div>

          <div style="min-width:0"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(a.inst || ACCT_TYPES[a.atype])} · last activity ${lastAct(a.id)}</div><div class="t2">This month +${fmt(inc, 0)} / −${fmt(exp, 0)}</div>
          <div class="btns" style="margin-top:8px"><button class="btn sm accent" data-act="match" data-id="${a.id}">Match</button><button class="btn sm" data-act="view-acct" data-id="${a.id}">Transactions</button><button class="btn ghost sm" data-act="edit-acct" data-id="${a.id}">Edit</button><button class="btn ghost sm" data-act="del-acct" data-id="${a.id}">Delete</button></div></div>
          <div class="amt">${a.atype === 'credit' ? `${money(-a.bal, {cls:a.bal < 0 ? 'neg' : ''})}<div class="sm muted" style="font-weight:600">owed</div>` : money(a.bal, {cls:a.bal < 0 ? 'neg' : ''})}</div></div>`; }).join('') : `<div class="empty">None yet.</div>`}</div></section>`).join('')}</div>`;
  }
};

/* ================= INVESTING ================= */
const pgInvesting = {
  html(){
    const invs = INV(); const ty = view.invType; const shown = ty === 'all' ? invs : invs.filter(i => i.H.t === ty);
    const val = sum(shown, i => i.H.value), cost = sum(shown, i => i.H.cost), gain = val - cost, real = sum(shown, i => i.H.realized);
    const types = [...new Set(invs.map(i => i.H.t))];
    const byT = types.map(t => [t, sum(invs.filter(i => i.H.t === t), i => i.H.value)]).sort((a, b) => b[1] - a[1]);
    const byW = Object.entries(shown.reduce((o, i) => { const k = i.wrap || 'Not set'; o[k] = (o[k]||0) + i.H.value; return o; }, {})).sort((a, b) => b[1] - a[1]);
    const yr = String(new Date().getFullYear());
    const contrib = {}; for (const i of invs){ const k = i.wrap || 'Not set';
      if (i.H.m === 'units') for (const l of i.lots || []) { if (l.side !== 'sell' && l.date.startsWith(yr)) contrib[k] = (contrib[k]||0) + num(l.units)*num(l.price) + num(l.fee); }
      else if (i.H.m === 'value') for (const c of i.contribs || []) { if (c.date.startsWith(yr) && num(c.amount) > 0) contrib[k] = (contrib[k]||0) + num(c.amount); }
      else if (i.start && i.start.startsWith(yr)) contrib[k] = (contrib[k]||0) + num(i.principal); }
    const maturing = invs.filter(i => i.H.m === 'fixed' && i.maturity).sort((a, b) => a.maturity.localeCompare(b.maturity));
    const stale = invs.filter(i => i.H.m !== 'fixed' && daysBetween(i.priceDate || i.valueDate || i.updated || '2000-01-01', today()) > 30).length;
    const groups = ty === 'all' ? types.map(t => [t, invs.filter(i => i.H.t === t)]).sort((a, b) => sum(b[1], i => i.H.value) - sum(a[1], i => i.H.value)) : [[ty, shown]];
    return `<div class="page-h"><div><h1>Investing</h1></div><div class="btns"><button class="btn primary" data-act="add-inv">Add investment</button></div></div>
      <div class="home">
      <div class="stack">
        <section class="card"><div class="hero-top"><span class="lbl">${ty === 'all' ? 'Total value' : esc(INV_T[ty].label)}</span>${gain ? `<span class="pill ${gain >= 0 ? 'good' : 'bad'}">${gain >= 0 ? '▲' : '▼'} ${cost ? Math.abs(gain/cost*100).toFixed(1) : '0.0'}%</span>` : ''}</div>
          <div class="xl">${money(val)}</div>
          <div class="hero-sub"><span>Put in <b>${fmt(cost, 0)}</b></span><span>Gain <b class="${gain >= 0 ? 'pos' : 'neg'}">${fmtS(gain, 0)}</b></span>${real ? `<span>Realized from sales <b class="${real >= 0 ? 'pos' : 'neg'}">${fmtS(real, 0)}</b></span>` : ''}</div>
          <div class="chips scroll" style="margin-top:18px"><button class="chip" data-act="inv-type" data-id="all" aria-pressed="${ty === 'all'}">All</button>${types.map(t => `<button class="chip" data-act="inv-type" data-id="${t}" aria-pressed="${ty === t}">${esc(INV_T[t].label)}</button>`).join('')}</div>
          ${stale ? `<p class="sm muted" style="margin:14px 0 0">${stale} holding${stale === 1 ? '' : 's'} not updated in over a month. Tap <b>Update</b> to enter today’s price.</p>` : ''}
        </section>
        ${groups.length ? groups.map(([t, list]) => `<section class="card"><div class="sec-h"><h2>${esc(INV_T[t].label)}</h2><span class="sm" style="font-weight:700">${fmt(sum(list, i => i.H.value), 0)}</span></div>
          <div class="list">${list.map(invRow).join('')}</div></section>`).join('') : '<section class="card"><div class="empty">No investments yet. Add stocks, ETFs, crypto, GICs or FDs, gold, a pension, property or anything else you own.</div></section>'}
      </div>
      <div class="stack">
        ${byT.length ? `<section class="card"><div class="sec-h"><h2>Mix by type</h2></div><div class="donut-wrap small"><canvas id="chAlloc" aria-label="Investments by type"></canvas><div class="donut-c"><div>${money(sum(byT, x => x[1]), {dec:0})}</div></div></div>
          <div class="legend" style="grid-template-columns:1fr">${byT.map(([t, v]) => `<div><span><i class="sw" style="background:var(--c${INV_T[t].c})"></i>${esc(INV_T[t].label)}</span><b>${fmt(v, 0)} · ${(v/sum(byT, x => x[1])*100).toFixed(0)}%</b></div>`).join('')}</div></section>` : ''}
        ${byW.length ? `<section class="card"><div class="sec-h"><h2>By account</h2><span class="sm muted">TFSA, RRSP and others</span></div>${byW.map(([w, v]) => `<div class="catrow"><span style="font-weight:700">${esc(w)}</span><span class="sm" style="font-weight:700">${fmt(v, 0)}</span><div class="bar"><i style="width:${v/byW[0][1]*100}%;background:var(--accent)"></i></div></div>`).join('')}</section>` : ''}
        ${Object.keys(contrib).length ? `<section class="card"><div class="sec-h"><h2>Put in during ${yr}</h2></div><p class="sm muted" style="margin:0 0 6px">Handy for tracking contribution room.</p>${Object.entries(contrib).sort((a, b) => b[1] - a[1]).map(([w, v]) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span style="font-weight:700">${esc(w)}</span><b>${fmt(v)}</b></div>`).join('')}</section>` : ''}
        ${maturing.length ? `<section class="card"><div class="sec-h"><h2>Maturity dates</h2></div>${maturing.map(i => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><div class="t1">${esc(i.name)}</div><div class="t2">${dateLabel(i.maturity)} · pays ${fmt(i.H.atMat, 0)}</div></div>${i.H.matured ? '<span class="pill warn">Matured</span>' : `<span class="pill ${i.H.daysLeft <= 30 ? 'acc' : ''}">${i.H.daysLeft} days</span>`}</div>`).join('')}</section>` : ''}
      </div></div>`;
  },
  after(){
    const invs = INV(); const types = [...new Set(invs.map(i => i.H.t))];
    const byT = types.map(t => [t, sum(invs.filter(i => i.H.t === t), i => i.H.value)]).sort((a, b) => b[1] - a[1]);
    if (byT.length) donut('chAlloc', byT.map(x => INV_T[x[0]].label), byT.map(x => Math.round(x[1])), byT.map(x => css('--c' + INV_T[x[0]].c)));
  }
};
function invRow(i){
  const H = i.H; const pc = H.cost ? H.gain/H.cost*100 : 0;
  let sub = '';
  if (H.m === 'units') sub = `${+H.units.toFixed(6)} ${esc(H.T.unit)} · avg ${fmt(H.avg)} · now ${fmt(num(i.price))}`;
  else if (H.m === 'fixed') sub = `${num(i.rate)}% · ${H.matured ? 'matured ' : 'matures '}${dateLabel(i.maturity)}`;
  else sub = `${fmt(H.cost, 0)} put in · updated ${dateLabel(i.valueDate || i.updated || i.date)}`;
  const tag = (i.sym || i.name || '?').slice(0, i.sym ? 4 : 2);
  return `<div class="row click" data-act="inv-open" data-id="${i.id}" tabindex="0" role="button" aria-label="Open ${esc(i.name)}"><div class="cat" style="--c:var(--c${H.T.c});font-size:${tag.length > 2 ? 11 : 14}px">${esc(tag)}</div>
    <div style="min-width:0"><div class="t1">${esc(i.name)} ${i.wrap ? `<span class="pill">${esc(i.wrap)}</span>` : ''}</div><div class="t2">${sub}</div></div>
    <div><div class="amt">${money(H.value)}</div><div class="sm ${H.gain >= 0 ? 'pos' : 'neg'}" style="text-align:right;font-weight:700">${fmtS(H.gain, 0)} · ${pc >= 0 ? '+' : ''}${pc.toFixed(1)}%</div></div></div>`;
}

/* ================= LOANS ================= */
const pgLoans = {
  html(){
    const ls = LOANS().map(l => ({...l, st:loanStats(l)}));
    const owe = ls.filter(l => l.dir !== 'lent'), lent = ls.filter(l => l.dir === 'lent');
    const card = l => { const st = l.st; const lentL = l.dir === 'lent'; const status = st.bal <= 0.005 ? '<span class="pill good">Paid off</span>' : st.nextDue && st.nextDue < today() ? `<span class="pill bad">Overdue since ${dateLabel(st.nextDue)}</span>` : st.nextDue ? `<span class="pill">Next ${dateLabel(st.nextDue)}</span>` : '';
      return `<div style="display:grid;gap:12px;padding:16px 0;border-top:1px solid var(--line)">
        <div class="row" style="padding:0"><div class="cat" style="--c:var(--c${lentL ? 3 : 9})">${svg('loan')}</div><div style="min-width:0"><div class="t1">${esc(l.name)} ${status}</div><div class="t2">${esc(l.party || '')}${l.party ? ' · ' : ''}${num(l.rate)}% yearly · ${num(l.term)} months · since ${dateLabel(l.start)}</div></div>
          <div class="amt">${money(st.bal)}<div class="sm muted" style="font-weight:600">${lentL ? 'owed to you' : 'left'}</div></div></div>
        <div class="bar"><i class="good" style="width:${(st.pct*100).toFixed(1)}%"></i></div>
        <div class="kv"><div><span>Monthly</span><b>${fmt(st.emi)}</b></div><div><span>${lentL ? 'Received' : 'Paid so far'}</span><b>${fmt(st.paid)}</b></div><div><span>Interest ${lentL ? 'earned' : 'paid'}</span><b>${fmt(st.interest)}</b></div>${st.payoff ? `<div><span>Done by</span><b>${monthLabel(st.payoff.slice(0, 7), true)}</b></div>` : ''}</div>
        <div class="sm muted">${(st.pct*100).toFixed(0)}% of ${fmt(num(l.principal), 0)} repaid${isFinite(st.left) && st.left > 0 ? ` · about ${st.left} payment${st.left === 1 ? '' : 's'} left${st.futureInt > 0 ? ` · ${fmt(st.futureInt, 0)} more interest on this plan` : ''}` : !isFinite(st.left) ? ' · <span class="neg">the monthly payment doesn’t cover the interest</span>' : ''}</div>
        <div class="btns">${st.bal > 0.005 ? `<button class="btn primary sm" data-act="pay-loan" data-id="${l.id}">${lentL ? 'Money received' : 'Record payment'}</button>` : ''}<button class="btn sm" data-act="sched-loan" data-id="${l.id}">History & plan</button><button class="btn ghost sm" data-act="edit-loan" data-id="${l.id}">Edit</button><button class="btn ghost sm" data-act="del-loan" data-id="${l.id}">Delete</button></div></div>`; };
    return `<div class="page-h"><div><h1>Loans</h1><div class="xl" style="margin-top:10px">${money(sum(owe, l => l.st.bal))}</div><div class="sm muted" style="margin-top:8px;font-weight:600">You owe · ${fmt(sum(owe, l => l.st.bal > 0 ? l.st.emi : 0), 0)} a month${lent.length ? ` · others owe you ${fmt(sum(lent, l => l.st.bal), 0)}` : ''}</div></div><button class="btn primary" data-act="add-loan">Add loan</button></div>
      <div class="grid2"><section class="card"><div class="sec-h"><h2>Money you owe</h2></div>${owe.length ? owe.map(card).join('') : '<div class="empty">No loans. Add a car loan, student loan, mortgage or line of credit.</div>'}</section>
      <section class="card"><div class="sec-h"><h2>Money owed to you</h2></div>${lent.length ? lent.map(card).join('') : '<div class="empty">Lent money to someone? Track it here so it doesn’t get forgotten.</div>'}</section></div>`;
  }
};

/* ================= PLAN: budgets + goals ================= */
const pgPlan = {
  html(){
    const m = view.budMonth; const s = S(); const b = s.budgets || {}; const sp = catSpend(m);
    const rows = Object.entries(b).map(([c, v]) => ({c, b:num(v), sp:sp[c]||0})).sort((x, y) => y.sp/y.b - x.sp/x.b);
    const unb = Object.entries(sp).filter(([c]) => !(c in b)).sort((a, z) => z[1] - a[1]);
    const totB = sum(rows, r => r.b), totS = sum(rows, r => r.sp);
    const [y, mo] = m.split('-').map(Number); const days = new Date(y, mo, 0).getDate(); const isCur = m === curMonth(); const dayN = isCur ? new Date().getDate() : days;
    const goals = GOALS().map(g => ({...g, gs:goalStats(g)}));
    return `<div class="page-h"><h1>Plan</h1><div class="btns"><button class="btn" data-act="add-goal">New goal</button><button class="btn primary" data-act="add-budget">Set a budget</button></div></div>
    <div class="home">
      <section class="card"><div class="hero-top"><span class="lbl">Left to spend in ${monthLabel(m, true)}</span><label class="sr" for="bMonth">Month</label><select id="bMonth" class="pill-select">${lastMonths(12).reverse().map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${monthLabel(x, true)}</option>`).join('')}</select></div>
        <div class="xl ${totB - totS < 0 ? 'neg' : ''}">${money(totB - totS)}</div>
        <div class="hero-sub"><span>Spent <b>${fmt(totS, 0)}</b></span><span>Budgeted <b>${fmt(totB, 0)}</b></span>${isCur && totB ? `<span><b>${days - dayN + 1}</b> days to go</span>` : ''}</div>
        <div style="margin-top:18px">${rows.length ? rows.map(r => { const p = r.sp/r.b; const pace = dayN/days; const st = p > 1 ? 'bad' : p > pace + 0.1 ? 'warn' : 'good';
          return `<div class="catrow" style="padding:12px 0;border-top:1px solid var(--line)"><span style="font-weight:700"><i class="sw" style="background:var(--c${catColor(r.c)})"></i>${esc(r.c)} ${st === 'bad' ? '<span class="pill bad">Over</span>' : st === 'warn' ? '<span class="pill warn">Ahead of pace</span>' : '<span class="pill good">On track</span>'}</span>
            <span style="font-weight:700;font-variant-numeric:tabular-nums">${fmt(r.sp, 0)} <span class="muted" style="font-weight:600">of ${fmt(r.b, 0)}</span> <button class="btn ghost sm" data-act="edit-budget" data-id="${esc(r.c)}">Edit</button></span>
            <div class="bar"><i class="${st}" style="width:${Math.min(100, p*100)}%"></i>${isCur ? `<span aria-hidden="true" style="position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45;left:${pace*100}%"></span>` : ''}</div>
            <div class="sm muted" style="grid-column:1/-1">${r.b - r.sp >= 0 ? fmt(r.b - r.sp, 0) + ' left' + (isCur && days - dayN + 1 > 0 ? ` · about ${fmt((r.b - r.sp)/(days - dayN + 1), 0)} a day` : '') : fmt(r.sp - r.b, 0) + ' over'}</div></div>`; }).join('') : '<div class="empty">No budgets yet. Start with the categories where money slips away, like dining out or shopping.</div>'}
        ${unb.length ? `<h3 style="margin:18px 0 4px">Spending without a budget</h3>${unb.map(([c, v]) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="t1" style="font-size:14.5px">${esc(c)}</span><b class="sm">${fmt(v)}</b><button class="btn sm" data-act="add-budget" data-id="${esc(c)}">Add budget</button></div>`).join('')}` : ''}</div>
      </section>
      <section class="card"><div class="sec-h"><h2>Savings goals</h2><span class="sm muted" style="font-weight:700">${fmt(sum(goals, g => g.gs.saved), 0)} saved</span></div>

function goalForm(g = {}){
  const isNew = !g.id;
  openDlg(`<h2 class="ttl">${isNew ? 'New goal' : 'Edit goal'}</h2>
    <div class="field"><label for="gName">What are you saving for?</label><input id="gName" name="name" required value="${esc(g.name || '')}" placeholder="e.g. Emergency fund"></div>
    <div class="two"><div class="field"><label for="gT">Target amount</label><input id="gT" name="target" type="number" step="1" min="1" inputmode="decimal" required value="${g.target ?? ''}"></div>
      <div class="field"><label for="gD">Target date</label><input id="gD" name="date" type="date" value="${esc(g.date || addMonths(today(), 12))}"></div></div>
    ${isNew ? `<div class="field"><label for="gS">Already saved</label><input id="gS" name="saved" type="number" step="0.01" min="0" inputmode="decimal" value="0"></div>` : ''}
    <div class="field"><span class="flbl" id="gcLbl">Colour</span><div class="chips" role="radiogroup" aria-labelledby="gcLbl">${[3,6,2,4,10,1,9,7].map(c => `<label style="cursor:pointer"><input class="sr" type="radio" name="c" value="${c}" ${num(g.c || 3) === c ? 'checked' : ''}><span aria-label="Colour ${c}" style="display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--c${c});outline-offset:2px"></span></label>`).join('')}</div></div>
    ${foot(isNew ? 'Create goal' : 'Save')}`,
    async fd => { const o = {...strip(g), kind:'goal', name:fd.get('name').trim(), target:num(fd.get('target')), date:fd.get('date'), c:num(fd.get('c')) || 3};
      if (isNew){ const s0 = num(fd.get('saved')); o.adds = s0 ? [{date:today(), amount:s0}] : []; }
      const ok = await put(g.id || newId('goal_'), o); if (ok) toast(isNew ? 'Goal created' : 'Saved'); return ok; },
    f => { const upd = () => f.querySelectorAll('input[name=c]').forEach(r => { r.nextElementSibling.style.outline = r.checked ? '3px solid var(--ink)' : 'none'; }); f.querySelectorAll('input[name=c]').forEach(r => r.addEventListener('change', upd)); upd(); });
}
function goalAddForm(g){
  const gs = goalStats(g);
  openDlg(`<h2 class="ttl">Add to ${esc(g.name)}</h2><p class="muted" style="margin:0">${fmt(gs.saved, 0)} of ${fmt(num(g.target), 0)} saved</p>
    <div class="seg" style="display:flex" role="radiogroup" aria-label="Direction"><label style="flex:1"><input type="radio" name="dir" value="1" checked>Add</label><label style="flex:1"><input type="radio" name="dir" value="-1">Take out</label></div>
    <div class="two"><div class="field"><label for="gaA">Amount</label><input id="gaA" name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required value="${gs.need ? Math.round(gs.need) : ''}" style="font-size:20px;font-weight:700"></div>
      <div class="field"><label for="gaD">Date</label><input id="gaD" name="date" type="date" required value="${today()}"></div></div>
    <p class="hint">This tracks progress only. If you also moved the money to a savings account, record a transfer so your balances follow.</p>${foot('Save')}`,
    async fd => { const o = strip(g); o.adds = [...(g.adds||[]), {date:fd.get('date'), amount:num(fd.get('amount'))*num(fd.get('dir'))}]; const ok = await put(g.id, o); if (ok){ const p = goalStats(o).p; toast(p >= 1 ? 'Goal reached! 🎉' : `${Math.round(p*100)}% there`); } return ok; });
}
function textDlg(title, text){ openDlg(`<h2 class="ttl">${esc(title)}</h2><p class="sm muted" style="margin:0">Copying was blocked here. Select all the text below and copy it yourself.</p><textarea rows="10" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea><div class="form-foot"><button type="submit" class="btn primary">Done</button></div>`, () => true, f => { const ta = f.querySelector('textarea'); ta.focus(); ta.select(); }); }
async function copy(text, title){ try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { textDlg(title, text); } }
function csv(){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date','Type','Amount','Category','Description','Account','To account','Monthly']];
  for (const t of [...TX()].reverse()) rows.push([t.date, t.type, t.type === 'expense' || t.type === 'invest' ? -num(t.amount) : num(t.amount), t.category, t.desc, acctName(t.acct), t.to ? acctName(t.to) : '', t.recurring ? 'yes' : '']);
  return rows.map(r => r.map(q).join(',')).join('\n');
}
function importDlg(){
  openDlg(`<h2 class="ttl">Restore from backup</h2><p class="sm muted" style="margin:0">Paste a backup copied from Money Ledger (from this page or the phone app). Items with the same ID are replaced; everything else is kept.</p>
    <textarea name="json" rows="8" required placeholder='{"app":"money-ledger", ...}' style="font-family:ui-monospace,monospace;font-size:12px"></textarea>${foot('Restore')}`,
    async fd => {
      let data; try { data = JSON.parse(fd.get('json')); } catch { toast('That text isn’t a valid backup. Copy the whole backup and try again.'); return false; }
      const items = data && data.docs && typeof data.docs === 'object' ? Object.entries(data.docs) : null;
      if (!items || !items.length){ toast('No items found in that backup.'); return false; }
      const valid = items.filter(([id, d]) => /^[A-Za-z0-9_\-.~:@+]{1,190}$/.test(id) && d && ['acct','tx','inv','loan','goal','settings'].includes(d.kind));
      if (Store.mode === 'local'){ valid.forEach(([id, d]) => docs.set(id, d)); saveLocal(); renderAll(); }
      else { for (const [id, d] of valid){ if (!(await put(id, d))) return false; } }
      toast(`Restored ${valid.length} items`); return true;
    });
}

/* ================= actions ================= */
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row.click[data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id; const d = id ? docs.get(id) : null; const W = d ? {...d, id} : null;
  switch (act){
    case 'demo-keep': return leaveDemo(true);
    case 'demo-empty': return leaveDemo(false);
    case 'more': return moreDlg();
    case 'go-settings': closeDlg(); location.hash = 'preferences'; return;
    case 'home-chip': view.homeChip = id; return renderAll();
    case 'act-from-home': view.act = {month:'all', acct:view.homeAcct, type:view.homeChip === 'in' ? 'income' : view.homeChip === 'out' ? 'expense' : 'all', cat:'all', q:''}; return;
    case 'st-kind': view.stats.kind = id; return renderAll();
    case 'st-per': view.stats.per = id; view.stats.off = 0; return renderAll();
    case 'st-off': view.stats.off = Math.min(0, view.stats.off + num(id)); return renderAll();
    case 'st-history': { const R = periodRange(view.stats.per, view.stats.off); view.act = {month:view.stats.per === 'month' ? R.s.slice(0, 7) : 'all', acct:view.stats.acct, type:view.stats.kind, cat:'all', q:''}; location.hash = 'activity'; return; }
    case 'inv-type': view.invType = id; return renderAll();
    case 'add-tx': return txForm({}, b.dataset.type);
    case 'edit-tx': return W && txForm(W);
    case 'del-tx': return W && confirmDlg('Delete this entry?', `${esc(W.desc || W.category || 'This entry')} · ${fmt(Math.abs(num(W.amount)))} on ${dateLabel(W.date)}. Account balances update right away.`, 'Delete', async () => { const ok = await del(id); if (ok) toast('Deleted'); return ok; });
    case 'log-due': { const t = dueRecurring().find(x => x.id === id); if (!t) return; const ok = await put(newId('tx_'), {kind:'tx', type:t.type, amount:num(t.amount), date:t.due, acct:t.acct, category:t.category, desc:t.desc, recurring:true, created:Date.now()}); if (ok) toast(`Logged ${t.desc || t.category}`); return; }
    case 'log-all': { for (const t of dueRecurring()){ if (!(await put(newId('tx_'), {kind:'tx', type:t.type, amount:num(t.amount), date:t.due, acct:t.acct, category:t.category, desc:t.desc, recurring:true, created:Date.now()}))) return; } toast('All monthly entries logged'); return; }
    case 'add-acct': return acctForm();
    case 'edit-acct': return W && acctForm(W);
    case 'match-pick': return matchPick();
    case 'match': return W && matchForm(W);
    case 'view-acct': view.act = {month:'all', acct:id, type:'all', cat:'all', q:''}; location.hash = 'activity'; return;
    case 'del-acct': { if (!W) return; const n = all('tx').filter(t => t.acct === id || t.to === id).length;
      if (n) return confirmDlg('Account has activity', `${esc(W.name)} has ${n} transaction${n === 1 ? '' : 's'}. Delete or move them to another account first, so your history stays accurate.`, 'Show transactions', () => { view.act = {month:'all', acct:id, type:'all', cat:'all', q:''}; location.hash = 'activity'; return true; });
      return confirmDlg('Delete account?', `${esc(W.name)} will be removed.`, 'Delete', async () => { const ok = await del(id); if (ok) toast('Account deleted'); return ok; }); }
    case 'add-inv': return invForm();
    case 'inv-open': return W && invDetail(W);
    case 'edit-inv': return W && invForm(W);
    case 'inv-price': return W && invPriceForm(W);
    case 'inv-buy': return W && invTradeForm(W, 'buy');
    case 'inv-sell': return W && invTradeForm(W, 'sell');
    case 'inv-close': return W && invCloseForm(W);
    case 'lot-del': { if (!W) return; const idx = +b.dataset.idx; const o = strip(W); o.lots = (W.lots||[]).filter((_, k) => k !== idx); if (await put(id, o)){ toast('Removed'); invDetail({...o, id}); } return; }
    case 'del-inv': return W && confirmDlg('Delete investment?', `${esc(W.name)} and its history will be removed from your totals. Transactions in Activity stay.`, 'Delete', async () => { const ok = await del(id); if (ok) toast('Deleted'); return ok; });
    case 'add-loan': return loanForm();
    case 'edit-loan': return W && loanForm(W);
    case 'pay-loan': return W && payForm(W);
    case 'sched-loan': return W && schedDlg(W);
    case 'del-loan': return W && confirmDlg('Delete loan?', `${esc(W.name)} and its payment history will be removed. Transactions already in Activity stay.`, 'Delete', async () => { const ok = await del(id); if (ok) toast('Loan deleted'); return ok; });
    case 'del-pay': { if (!W) return; const idx = +b.dataset.idx; const o = strip(W); o.payments = (W.payments||[]).filter((_, i) => i !== idx); if (await put(id, o)){ toast('Payment removed'); schedDlg({...o, id}); } return; }
    case 'add-budget': return budgetForm(id);
    case 'edit-budget': return budgetForm(id);
    case 'add-goal': return goalForm();
    case 'edit-goal': return W && goalForm(W);
    case 'goal-add': return W && goalAddForm(W);
    case 'del-goal': return W && confirmDlg('Delete goal?', `${esc(W.name)} will be removed.`, 'Delete', async () => { const ok = await del(id); if (ok) toast('Goal deleted'); return ok; });
    case 'copy-json': return copy(JSON.stringify({app:'money-ledger', version:2, exported:today(), docs:Object.fromEntries(docs)}), 'Your backup');
    case 'copy-csv': return copy(csv(), 'Transactions CSV');
    case 'import': return Store.mode === 'demo' ? demoPrompt() : importDlg();
    case 'wipe': return Store.mode === 'demo' ? demoPrompt() : confirmDlg('Delete all your data?', 'Every account, transaction, investment, loan, goal and budget will be gone. This can’t be undone.', 'Delete everything', async () => {
      const keepCur = S().currency;
      if (Store.mode === 'local'){ docs = new Map([['settings', {...DEFAULT_SETTINGS, currency:keepCur}]]); saveLocal(); renderAll(); }
      else { for (const k of [...docs.keys()]) if (k !== 'settings'){ if (!(await del(k))) return false; } await put('settings', {...DEFAULT_SETTINGS, currency:keepCur}); }
      toast('All data deleted'); return true; });
  }
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Store.mode !== 'loading' && !dlg.open && renderAll());
new MutationObserver(() => Store.mode !== 'loading' && !dlg.open && renderAll()).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

renderNav();
connect();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
